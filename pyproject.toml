# StudyPet 工程配置
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 标准规则：语法/未定义名/未用变量(pyflakes) + pycodestyle 基础 + 导入排序 + 现代化写法
select = ["E4", "E7", "E9", "F", "I", "UP"]
# 判题引擎使用「升级段覆盖旧实现」的模式（见 tools/zhenti_engine.py v2-v6 段），
# 这是有意的热替换，F811 重定义告警在此豁免
ignore = ["F811"]

[tool.ruff.lint.per-file-ignores]
# 工具脚本：防御性解析大量使用 try/except 兜底，属预期行为
"tools/*.py" = ["BLE001", "S110", "S112", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["tools"]